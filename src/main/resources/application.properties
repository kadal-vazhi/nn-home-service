# Application Info
spring.application.name=nn-home-service
server.port=9090

# PostgreSQL Datasource Configuration (Reads from .env / System Environment)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/${DB_NAME:kadalvazhi_core}}
spring.datasource.username=${DB_USER:kadalvazhi_core}
spring.datasource.password=${DB_PASSWORD:kadalvazhi_core_secure_pwd_2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# Redis Cache & Leaderboard Configuration (Protected with Password)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:kadalvazhi_redis_secret_2026}

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Schema-per-Service: Route all tables to the dedicated user_mgmt schema
spring.jpa.properties.hibernate.default_schema=user_mgmt

# Automatically initialize database schema scripts on startup
spring.sql.init.mode=always

# CRITICAL PERFORMANCE SETTING:
# Open-Session-In-View (OSIV) disabled. Keeping this false ensures database connections
# are immediately returned to HikariCP pool after service transactions, drastically
# lowering connection pool contention and latency under high traffic.
spring.jpa.open-in-view=false

# HikariCP Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Actuator Endpoints for AWS EKS Health Probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Swagger OpenAPI Documentation Path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
