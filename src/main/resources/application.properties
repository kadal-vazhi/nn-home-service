# Application Info
spring.application.name=nn-home-service
server.port=8081

# PostgreSQL Datasource Configuration (with Environment Variable Overrides for AWS / Docker)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kadalvazhi_home_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# CRITICAL PERFORMANCE SETTING:
# Open-Session-In-View (OSIV) disabled. Keeping this false ensures database connections
# are immediately returned to HikariCP pool after service transactions, drastically
# lowering connection pool contention and latency under high traffic.
spring.jpa.open-in-view=false

# HikariCP Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Actuator Endpoints for AWS EKS Health Probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Swagger OpenAPI Documentation Path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
