services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: kadalvazhi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432" # Maps Mac localhost:5432 -> Container 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Redis In-Memory Cache & Leaderboard Service (Protected with Password)
  redis:
    image: redis:7-alpine
    container_name: kadalvazhi-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379" # Maps Mac localhost:6379 -> Container 6379
    volumes:
      - redis_data:/data

  # 3. Optional Web pgAdmin Console (Access via browser: http://localhost:5050)
  # NOTE: You can also connect your local Mac pgAdmin app directly to localhost:5432!
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kadalvazhi-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
